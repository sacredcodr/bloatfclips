# Builds bloatfclips.exe and the installer on GitHub's Windows runners.
# - Every push to master and every pull request: build, keep the installer as a workflow artifact.
# - Pushing a version tag (git tag v0.2.0 && git push origin v0.2.0): also publish a GitHub Release
#   with the installer. The tag must match the version in src/app.rc.
# Runners have no NVIDIA GPU, so the NVENC/capture tests are not run here; run clipper_tests.exe locally.
name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja and Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build exe and installer
        shell: pwsh
        run: ./tools/build_installer.ps1

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Item build-release/bloatfclips.exe).VersionInfo.ProductVersion
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match src/app.rc version $version. Bump BFC_VERSION_* first."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: bloatfclips-installer
          path: dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bloatfclips-installer
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "bloatfclips ${GITHUB_REF_NAME#v}" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.exe --clobber
